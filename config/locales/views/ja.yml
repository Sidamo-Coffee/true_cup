        dark: "苦め・どっしり（深煎り）"
  services:
    recommended_roast:
      # おすすめの根拠。件数ではなく評価の高さで選ぶ（#117）
      reason:
        liked: "好評価の記録の中で評価が最も高い"
        all: "全記録の中で評価が最も高い"
        diagnosis: "味覚診断ベース"
        # 平均評価が同点のとき。片方を「最も高い」と呼ばない（#146）
        liked_tied: "好評価の記録の中で同じくらい"
        all_tied: "全記録の中で同じくらい"
      message:
        liked: "あなたが高く評価した記録から見ると、この焙煎度が合いやすいです。"
        all: "これまでの記録の中では、この焙煎度への評価がいちばん高いです。"
        diagnosis: "まずは診断結果の焙煎度を軸に選んで、記録を増やしてみましょう。"
        liked_tied: "どちらも同じくらい高く評価しています。まずはこの2つから選んでみてください。"
        all_tied: "これまでの記録では、この2つへの評価が同じくらいです。どちらから試しても大丈夫です。"
      # おすすめの確からしさ。段階は「何を根拠にしたか」と「その裏付け件数」から決まるため、
      # おすすめの表示と食い違うことがない（#118）
      notice:
        hypothesis: "いまは診断結果からの予想です。記録するほど、あなたの実際の好みに近づきます。"
        # 記録はあるが、どの焙煎度も評価が低く根拠にできない場合（#117）
        low_rated: "これまでの記録では、まだ好みに合いそうな焙煎度が見つかっていません。診断結果の焙煎度を試してみてください。"
        # 3つ以上の焙煎度が同じ評価で並び、絞り込めない場合（#146）
        undecided: "いまはどの焙煎度も同じくらいの評価で、絞り込めていません。しっくりきた一杯に高めの評価をつけると、傾向が見えてきます。"
        likely: "記録%{count}件をもとにした暫定の傾向です。記録が増えると変わることがあります。"
        stable: "記録%{count}件をもとにしており、傾向は安定しています。"
      # 次の段階までの進み具合（#122）。急かす表現にしない
      progress:
        label:
          hypothesis: "診断からの予想"
          likely: "記録からの傾向"
          stable: "安定した傾向"
        remaining:
          hypothesis: "あと%{count}件記録すると、あなたの記録からおすすめを出せるようになります。"
          # 分子は「焙煎度を記録した件数」。単調に増える量でなければバーが後退する
          likely: "あと%{count}件記録すると、傾向が安定します。"
        done: "十分な記録が集まりました。"
  preferences:
    show:
      # 診断（仮説）と★4以上の記録（実測）のズレ（#120）
      gap:
        title: "診断と、実際の記録"
        lead_diverged: "診断では「%{diagnosed}」でしたが、あなたが高く評価した記録を見ると「%{actual}」が合っているようです。"
        lead_aligned: "診断は「%{diagnosed}」。高く評価した記録もその傾向で、診断どおりの好みのようです。"
        lead_taste_only_diverged: "高く評価した記録を見ると、診断とは少し違う好みが見えてきています。"
        lead_taste_only_aligned: "高く評価した記録は、診断の傾向とおおむね一致しています。"
        based_on: "★4以上をつけた%{count}件をもとにしています。"
        axis:
          bitterness: "苦味"
          acidity: "酸味"
        # 「実際」だけだと、直上の味グラフ（全記録の平均）と区別がつかない。
        # どの記録を見た値なのかをラベルに出す
        column:
          diagnosed: "診断"
          actual: "★4以上"
        # 記録しているのは「その一杯の苦味の強さ」なので、好みを断定せず事実として述べる
        direction:
          higher: "高く評価した記録は、診断より強めでした"
          lower: "高く評価した記録は、診断より控えめでした"
          same: "診断とほぼ同じ"
        rediagnose: "もう一度診断する"
        rediagnose_note: "好みは変わることがあります。しっくりこなければ診断し直せます。"
      title:
        all: "よく飲んでいる傾向"
        liked: "好みの傾向"

      tabs:
        all: "全記録（よく飲む）"
        liked: "★4以上（好き）"

      empty: "この条件では表示できる記録がありません。"

      # 見出しは円グラフと同じ「件数」を説明するもの。
      # 「好み」の判定はおすすめ側（評価ベース）が担うため、ここで好みを主張しない（#117）
      summary:
        text: "あなたは「%{roast}」のコーヒーを %{suffix}。"
        # 件数が同数のときは、片方を「最も」と呼ばない（#144）
        tied_two: "「%{first}」と「%{second}」を %{suffix}。"
        tied_many: "いくつかの焙煎度を %{suffix}。"
        suffix:
          all: "よく飲んでいます"
          liked: "★4以上をつけた記録の中で、いちばん多く飲んでいます"
        suffix_tied:
          all: "同じくらい飲んでいます"
          liked: "★4以上をつけた記録の中で、同じくらい飲んでいます"

      charts:
        roast:
          title: "焙煎度の割合（件数）"
          unknown_only: "焙煎度を記録した分がまだありません。記録するときに焙煎度を選ぶと、ここに好みの傾向が表示されます。"
          unknown_note:
            one: "このほかに、焙煎度が「不明」の記録が %{count} 件あります。"
            other: "このほかに、焙煎度が「不明」の記録が %{count} 件あります。"
        taste:
          title: "味の傾向（0〜10）"
          note: "選んだ記録の平均（件数ベース）です。焙煎度が「不明」の記録も含みます。"

      ranking:
        title: "焙煎度ランキング（Top3）"
        row: "割合：%{percent}% ・件数：%{count}件"
        note: "「割合」は、選んだ記録の件数に対する比率です。"
  static_pages:
    top:
      hero:
        kicker: "あなたにとっての「理想の」コーヒーとは？"
        heading_html: |
          難しい知識はいりません。<br>
          あなただけの<br>「好きな一杯」<br>がきっと見つかる。
        lead_html: |
          TrueCup は、簡単な味覚診断とコーヒー記録で、<br class="hidden md:block">
          あなたの好みを見える化する Web アプリです。<br class="hidden md:block">
          専門用語がわからなくても、「自分の基準」で豆や焙煎度を選べるようになります。
        cta_signup: "新規登録して味覚診断を始める"
        cta_login: "ログインはこちら"
        cta_trial: "まずは味覚診断をしてみる"

      belief:
        heading: "コーヒーは好き。でも、自分の「好み」はよく分からない——そんなあなたへ。"
        p1: "「コーヒーは好きだけど、自分の好みがよく分からない」。そんなふうに感じたことはありませんか。"
        p2: "TrueCup は、専門的な言葉を覚えなくても、日々の一杯から「自分の好きな味」を見つけていくためのアプリです。"
        p3: "難しいことはアプリに任せて、まずはリラックスして、コーヒーを楽しむことから始めましょう。"

      steps:
        heading: "好みがわかる、3つのステップ"
        lead: "味覚診断とコーヒー記録で、少しずつ「自分の基準」が見えてきます。"
        step1:
          label: "STEP 1"
          title: "かんたん味覚診断"
          body: "いくつかの質問に答えるだけで、あなたの味覚の傾向がわかります。"
        step2:
          label: "STEP 2"
          title: "飲んだコーヒーをサッと記録"
          body: "銘柄や焙煎度、ひとことメモを残していくだけ。思いついたタイミングで、気軽に記録できます。"
        step3:
          label: "STEP 3"
          title: "「好き」が少しずつ見えてくる"
          body: "記録がたまるほど、よく選ぶ味の傾向や、次に試してみたい一杯のヒントが見えてきます。"

      closing:
        message_html: |
          飲むほどに、あなたの「基準」が磨かれていく。<br>
          新しい一杯との出会いを、ここから始めてみませんか。
        cta_signup: "会員登録してスタート（無料）"
        cta_trial: "まずは味覚診断をしてみる"
        cta_login: "すでに登録済みの方はこちら（ログイン）"
  