services:
  db:
    image: postgres
    restart: always
    environment:
      TZ: Asia/Tokyo
      POSTGRES_PASSWORD: password
    volumes:
      - postgresql_data:/var/lib/postgresql
    ports:
      # ホスト側のポートは .env の DB_PORT で上書きできる。
      # 別プロジェクトのDBが 5432 を使っていて衝突する場合に逃がすためのもので、
      # アプリ／テストは database.yml の host: db でコンテナ間接続するため影響はない。
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # データベース名を指定すると db:prepare 前の初回起動で healthy にならないため、
      # 接続可否だけを見る。
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "bundle install && yarn install && bundle exec rails db:prepare && rm -f tmp/pids/server.pid && ./bin/dev"
    tty: true
    stdin_open: true
    volumes:
      - .:/myapp
      - node_modules:/myapp/node_modules
    environment:
      TZ: Asia/Tokyo
    ports:
      - "3000:3000"
    # user は指定しない。macOS のホストユーザーは uid 501 のため uid 1000 を
    # 強制するとバインドマウント上のファイル権限がずれる。
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgresql_data:
  node_modules: